# Publica automaticamente cada alteração enviada à branch main.
name: Publicar no Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Publicar (só depois da primeira instalação)
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "Token do Fly ainda não configurado — nada a publicar."; exit 0; fi
          APP=$(grep -E '^app = ' fly.toml | cut -d'"' -f2)
          if ! flyctl status -a "$APP" >/dev/null 2>&1; then echo "App ainda não criado — rode a Primeira instalação."; exit 0; fi
          flyctl deploy --remote-only --ha=false
