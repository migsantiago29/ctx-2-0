# CTX 2.0 no Fly.io — 1 máquina pequena sempre ligada, em São Paulo, com 1 volume de dados.
app = "ctx2-cenografia"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # nunca desligar: a rotina diária e os backups precisam rodar
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
